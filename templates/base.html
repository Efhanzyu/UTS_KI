<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Brankas File Tugas Kuliah — Enkripsi dan dekripsi berkas serta teks akademik dengan algoritma kriptografi modern.">
    <title>{% block title %}Brankas File Tugas Kuliah{% endblock %}</title>
    <!-- Google Font: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/editorial.css') }}">
</head>

<body>

    <!-- ═══════════════════════════ NAVBAR ═══════════════════════════ -->
    <nav class="navbar" role="navigation" aria-label="Navigasi Utama">
        <div class="nav-container">
            <a href="/" class="nav-brand" aria-label="Brankas Beranda">
                <span class="nav-brand-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
            </span>
                <div class="nav-brand-text">
                    <span>Brankas</span>
                    <span class="nav-badge">Tugas Kuliah</span>
                </div>
            </a>

            <button class="menu-toggle" type="button" aria-label="Buka menu" aria-expanded="false" aria-controls="primary-navigation">
            <span class="menu-toggle-lines" aria-hidden="true"></span>
        </button>
            <ul class="nav-links" id="primary-navigation" aria-label="Navigasi halaman">
                <li>
                    <a href="/" class="nav-link {% if active_page == 'dashboard' %}active{% endif %}">
                        <span class="nav-text">Beranda</span>
                    </a>
                </li>
                <li>
                    <a href="/encrypt" class="nav-link {% if active_page == 'file' %}active{% endif %}">
                        <span class="nav-text">Enkripsi File</span>
                    </a>
                </li>
                <li>
                    <a href="/decrypt" class="nav-link {% if active_page == 'decrypt' %}active{% endif %}">
                        <span class="nav-text">Dekripsi File</span>
                    </a>
                </li>
                <li>
                    <a href="/text" class="nav-link {% if active_page == 'text' %}active{% endif %}">
                        <span class="nav-text">Enkripsi Teks</span>
                    </a>
                </li>
                <li>
                    <a href="/benchmark" class="nav-link {% if active_page == 'benchmark' %}active{% endif %}">
                        <span class="nav-text">Benchmark</span>
                    </a>
                </li>
                <li>
                    <a href="/#about" class="nav-link"><span class="nav-text">Tentang</span></a>
                </li>
                <li class="nav-cta-item">
                    <a href="/encrypt" class="btn btn-primary btn-sm">Mulai Enkripsi</a>
                </li>
            </ul>
        </div>
    </nav>

    <!-- ═══════════════════════════ MAIN CONTENT ═══════════════════════════ -->
    <main class="main-content" id="main-content">
        {% block content %}{% endblock %}
    </main>

    <!-- ═══════════════════════════ FOOTER ═══════════════════════════ -->
    <footer class="footer" role="contentinfo">
        <div class="footer-container">
            <div class="footer-left">
                Brankas File Tugas Kuliah &mdash; Proyek Mata Kuliah Keamanan Informasi
            </div>
            <div class="footer-right">
                Universitas Siliwangi &bull; 2026
            </div>
        </div>
    </footer>

    <!-- ═══════════════════════════ SCRIPTS ═══════════════════════════ -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block scripts %}{% endblock %}

</body>

</html>
